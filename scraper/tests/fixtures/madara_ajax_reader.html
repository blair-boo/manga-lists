     Madara, montado para exercitar `MadaraAdapter.listar_capitulos` (aba
     Reader). Difere de madara_ajax_chapters.html (que só cobre o parse() do
     "último capítulo") por incluir os casos que quebram implementações
     ingênuas, todos observados ao vivo em bellerepository/hazelnade em 2026-08:

       - capítulo BLOQUEADO: classe `premium-block`, `href="#"` (sem URL!),
         `data-chapter-N` na classe e um <span class="soon_free"> com a data de
         liberação já calculada — é dela que sai o disponivel_em;
       - <i class="fas fa-lock"> DENTRO da âncora, sujando o rótulo;
       - sufixo " - END" no rótulo do último capítulo;
       - capítulo .5 (numeração fracionária);
       - side story, que corre num eixo de numeração próprio (existe "Side
         Story 1" numa obra que também tem "Chapter 1");
       - DOIS capítulos com o mesmo rótulo em URLs diferentes (o `_1` é o
         WordPress desempatando slug numa republicação) — caso real, e o que
         exige o desempate por URL.

     A ordem é do mais recente pro mais antigo, como o tema serve de verdade. -->
