name: Backup (Supabase -> Cloudflare R2)

# Todo domingo. Banco: 4 semanais + 4 mensais (primeiro domingo do mês). Imagens:
# espelho incremental, com limpeza do que saiu do Supabase em janeiro e julho.
# Detalhes e layout no docstring de scraper/backup_supabase.py e no README.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch: {}

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pip install requests==2.32.3

      - name: Instalar rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone

      - name: Backup
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # rclone configurado só por variáveis (sem arquivo de config).
          # NO_CHECK_BUCKET: o token do R2 é restrito a este bucket e não pode criá-lo.
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_S3_NO_CHECK_BUCKET: 'true'
        run: python backup_supabase.py

      # Lê de volta do R2 o backup que acabou de ser gravado e confere a
      # integridade (JSON legível e contagem de linhas igual à do manifest).
      # Se falhar, o workflow fica vermelho e o GitHub avisa por e-mail.
      - name: Verificar backup gravado
        env:
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          RCLONE_S3_NO_CHECK_BUCKET: 'true'
        run: node scripts/restaurar-supabase.mjs --verificar
