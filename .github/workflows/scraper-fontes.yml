name: Scraper - Fontes

# Sem agendamento de propósito: essa busca é disparada manualmente pelo botão
# "Iniciar busca" na aba Atualizações do app (via Supabase Edge Function).
on:
  workflow_dispatch: {}

concurrency:
  group: scraper-fontes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Descobrir novas fontes
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Roteamento por API de scraping (ScraperAPI/scrape.do) pros hosts
          # atrás de challenge JS do Cloudflare (comix.to). Só ativa quando a
          # secret da chave existe; sem ela, é no-op. Ver scraper/scraping_api.py.
          SCRAPING_API_HOSTS: comix.to,comix.ws
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
        run: python discover_fontes.py
