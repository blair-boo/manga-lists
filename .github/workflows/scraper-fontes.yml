name: Scraper - Fontes

# Sem agendamento de propósito: essa busca é disparada manualmente pelo botão
# "Find new sources" em Settings > Sources do app (via Supabase Edge Function),
# que envia as opções abaixo.
on:
  workflow_dispatch:
    inputs:
      tipos:
        description: "manga, novel ou vazio (todas)"
        required: false
        default: ""
      web_dominios:
        description: "somente, excluir ou vazio (busca web geral)"
        required: false
        default: ""

concurrency:
  group: scraper-fontes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    # Sem isso o teto é o padrão de 6h do GitHub, que mata o job sem gravar status.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Descobrir novas fontes
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FONTES_TIPOS: ${{ inputs.tipos }}
          FONTES_WEB_DOMINIOS: ${{ inputs.web_dominios }}
          # Roteamento por API de scraping (ScraperAPI/ScrapingBee/scrape.do) pros hosts
          # atrás de challenge JS do Cloudflare (comix.to). Só ativa quando a
          # secret da chave existe; sem ela, é no-op. Ver scraper/scraping_api.py.
          SCRAPING_API_HOSTS: comix.to,comix.ws
          SCRAPING_API_ORDER: scraperapi,scrapingbee,scrapedo
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
        run: python discover_fontes.py
