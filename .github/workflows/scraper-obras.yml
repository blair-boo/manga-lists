name: Scraper - Obras

# Sem agendamento de propósito: essa varredura é disparada manualmente pelo botão
# "Update works" na aba Atualizações do app (via Supabase Edge Function).
on:
  workflow_dispatch: {}

concurrency:
  group: scraper-obras
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Instalar dependências
        run: pip install -r scraper/requirements.txt

      - name: Casar catálogo dos sites com obras cadastradas
        working-directory: scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Roteamento por API de scraping (ScraperAPI/ScrapingBee/scrape.do) pros hosts
          # atrás de challenge JS do Cloudflare (comix.to). Só ativa quando a
          # secret da chave existe; sem ela, é no-op. Ver scraper/scraping_api.py.
          # Providers de scraping em STAND-BY: o comix.to voltou a responder no
          # acesso direto, e as três contas (ScraperAPI/ScrapingBee/scrape.do)
          # estão vencidas ou sem cota. O caminho pago continua no código e
          # testado — só não é tentado, pra não gastar chamada/crédito à toa.
          # Se algum host desta lista voltar a levar bloqueio direto, a run
          # grava um alerta e a aba Updates pede a renovação das secrets
          # (ver scraping_api.registrar_necessidade). Pra religar: tire esta
          # env e reponha as secrets.
          SCRAPING_API_STANDBY: 'true'
          SCRAPING_API_HOSTS: comix.to,comix.ws
          SCRAPING_API_ORDER: scraperapi,scrapingbee,scrapedo
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
          SCRAPEDO_TOKEN: ${{ secrets.SCRAPEDO_TOKEN }}
          # Catálogo do comix DESLIGADO de propósito: a API /api/v1/manga fica
          # atrás do Cloudflare e responde 5xx quando chega renderizada como
          # navegação (não XHR) pelas APIs de scraping — validado sem sucesso em
          # 3 runs (30-31/07). As obras do comix são cadastradas por outro
          # caminho; ele entra só no estágio de capítulos (que lê o #initial-data
          # e funciona ao vivo). Pra religar: COMIX_CATALOGO_ATIVO=true. Ver
          # _catalogo_ativo em adapters_novos.py.
        run: python update_obras.py
